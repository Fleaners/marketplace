name: dealerconnect_app
description: DealerConnect mobile frontend for Marketplace Premium
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.6
  http: ^1.1.0
  shared_preferences: ^2.1.1
  image_picker: ^0.8.7+4
  url_launcher: ^6.1.10
  flutter_svg: ^2.0.9
  flutter_cached_pdfview: ^0.5.0
  path_provider: ^2.0.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/
