name: Playwright Smoke Tests (Live)

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 2 * * *' # daily at 02:00 UTC

jobs:
  smoke:
    name: Run Playwright smoke tests against live site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./next_app
        run: npm ci

      - name: Install Playwright browsers and deps
        working-directory: ./next_app
        run: npx playwright install --with-deps

      - name: Run Playwright smoke tests
        working-directory: ./next_app
        env:
          SMOKE_BASE_URL: 'https://marketplace-store-fef91.web.app'
        run: |
          # Run targeted smoke specs against the live site. Allow failures so we always upload artifacts.
          npx playwright test tests/navigation.spec.ts tests/product_crud.spec.ts tests/profile_persistence.spec.ts --workers=1 || true
          # Emit an HTML report (playwright creates playwright-report by default)
          npx playwright show-report --browser=chromium || true

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: next_app/playwright-report

      - name: Upload Playwright test-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: next_app/test-results
