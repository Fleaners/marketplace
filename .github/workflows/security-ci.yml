name: Security CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run strict key-pattern scanner
        shell: pwsh
        run: ./scripts/full-secret-scan.ps1
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  secret-diff-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan changed files for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
          git diff --name-only origin/${{ github.base_ref }}...HEAD | while read -r file; do
            if [ -f "$file" ]; then
              gitleaks detect --no-git --source "$file" --verbose
            fi
          done

  env-file-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for committed .env files
        run: |
          ENV_FILES=$(find . -type f -name ".env*" ! -name ".env.example" ! -path "*/\.git/*")
          if [ -n "$ENV_FILES" ]; then
            echo "Error: Found committed .env files (other than .env.example):"
            echo "$ENV_FILES"
            exit 1
          fi

  trufflehog-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: TruffleHog Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  dependency-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [functions, backend, web_app, next_app]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - name: Install
        run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high

  sast-semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten

  owasp-dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: marketplace-store
          path: .
          format: HTML
          out: reports
          args: >
            --failOnCVSS 8
            --enableRetired
      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: reports

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          output-file: sbom.spdx.json
          format: spdx-json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build -t marketplace-backend:security ./backend
      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: marketplace-backend:security
          format: table
          exit-code: '1'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  dast-zap-baseline:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: https://marketplace-store-fef91.web.app

  deployment-security-gate:
    runs-on: ubuntu-latest
    needs:
      - secret-scan
      - dependency-audit
      - sast-semgrep
      - owasp-dependency-check
      - container-scan
      - trufflehog-scan
      - env-file-check
    steps:
      - name: Security gate passed
        run: echo "All required security checks passed."
